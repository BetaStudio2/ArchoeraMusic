name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pkg-config & mingw (CGO / FFmpeg pkg-config 查找)
        shell: bash
        run: choco install pkgconfiglite mingw -y --no-progress

      - name: Cache vcpkg installed (ffmpeg/taglib 等预编译，跨 run 秒级恢复；key 随 vcpkg.json 内容变化自动失效)
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-${{ hashFiles('app/vcpkg.json') }}

      - name: Install vcpkg deps (manifest 模式，依赖清单见 app/vcpkg.json)
        shell: bash
        working-directory: app
        run: vcpkg install --triplet x64-windows
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_INSTALLED_DIR: C:\vcpkg\installed

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prebuild Rust tempo staticlib (MSVC 命名归一化)
        shell: bash
        run: |
          cd app/core/audio-engine/tempo-rs
          cargo build --release --target-dir ../build/tempo-target
          find ../build/tempo-target/release -maxdepth 1 \( -name '*.lib' -o -name '*.a' \) -exec cp {} ../build/tempo-target/release/libaudio_tempo.lib \;
          cp ../build/tempo-target/release/libaudio_tempo.lib ../build/libaudio_tempo.lib

      - name: Build audio-engine (C + FFmpeg via vcpkg)
        shell: bash
        run: |
          export PKG_CONFIG_PATH="C:/vcpkg/installed/x64-windows/lib/pkgconfig"
          cmake -S app/core/audio-engine -B app/core/audio-engine/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build app/core/audio-engine/build --config Release

      - name: Build scraper (C++)
        shell: bash
        run: |
          cmake -S app/core/scraper -B app/core/scraper/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build app/core/scraper/build --config Release

      - name: Build scanner (C# NativeAOT)
        shell: bash
        run: bash app/core/scanner/build.sh win-x64

      - name: Build downloader (Rust cdylib)
        shell: bash
        run: cargo build --release --manifest-path app/core/downloader/Cargo.toml

      - name: Build subsonic (Go + Rust transcoder)
        shell: bash
        run: bash app/core/subsonic/build.sh

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: dart analyze lib

      - name: Test (unit smoke)
        working-directory: app
        run: flutter test test/widget_test.dart

      - name: Build Flutter Windows
        working-directory: app
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-windows-x64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error
