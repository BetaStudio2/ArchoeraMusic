# ArchoeraOS 默认用户 Archoera 的家目录与初始配置。
# 首次启动（systemd-tmpfiles-setup）创建目录并按 skel 播种配置；
# 目标已存在时不会被覆盖，用户修改可持久保存（磁盘镜像重启不丢）。
d /home/archoera 0755 archoera archoera -
d /home/archoera/.config 0755 archoera archoera -
d /home/archoera/.config/fcitx5 0755 archoera archoera -
d /home/archoera/.local 0755 archoera archoera -
d /home/archoera/.local/share 0755 archoera archoera -
d /home/archoera/.local/share/ArchoeraMusic 0755 archoera archoera -
d /home/archoera/.local/state 0755 archoera archoera -
d /home/archoera/.cache 0755 archoera archoera -
# 媒体库默认位置（播放器设置里可改；存在即可作为扫描目录）。
d /home/archoera/Music 0755 archoera archoera -

# 初始配置播种（C = 目标不存在时从 skel 复制）。
C /home/archoera/.config/fcitx5/profile 0644 archoera archoera - /usr/share/archoera/skel/fcitx5-profile
C /home/archoera/.local/share/ArchoeraMusic/scan_dirs.json 0644 archoera archoera - /usr/share/archoera/skel/scan_dirs.json

# enablement 目录需先存在，否则下面的 L+ 会失败（mkosi 镜像里没有 /etc 骨架）。
d /etc/systemd/system/multi-user.target.wants 0755 root root -

# 启用 BlueZ（systemd 无法在镜像里跑 systemctl enable）：
# 目标单元 + D-Bus 激活别名（org.bluez 的 SystemdService=dbus-org.bluez.service）。
L+ /etc/systemd/system/multi-user.target.wants/bluetooth.service - - - - /usr/lib/systemd/system/bluetooth.service
L+ /etc/systemd/system/dbus-org.bluez.service - - - - /usr/lib/systemd/system/bluetooth.service

# 启用 polkit（logind 电源动作的授权判定；D-Bus 激活之外的显式兜底）。
L+ /etc/systemd/system/multi-user.target.wants/polkit.service - - - - /usr/lib/systemd/system/polkit.service

# 开机/关机画面：Plymouth 单元在 Arch 里没有 [Install]（标准做法是由 initrd 的
# poweroff/reboot.target.wants 拉起）。我们用 mkosi-initrd，改为在主镜像内建立
# 同样的 enablement：sysinit 启动、multi-user 退出（getty@tty1 已 After=quit-wait，
# 因此 kiosk 会话会在 Plymouth 释放 DRM 之后再启动）、关机/重启目标再拉起画面。
d /etc/systemd/system/sysinit.target.wants 0755 root root -
d /etc/systemd/system/poweroff.target.wants 0755 root root -
d /etc/systemd/system/reboot.target.wants 0755 root root -
L+ /etc/systemd/system/sysinit.target.wants/plymouth-start.service - - - - /usr/lib/systemd/system/plymouth-start.service
L+ /etc/systemd/system/multi-user.target.wants/plymouth-quit.service - - - - /usr/lib/systemd/system/plymouth-quit.service
L+ /etc/systemd/system/multi-user.target.wants/plymouth-quit-wait.service - - - - /usr/lib/systemd/system/plymouth-quit-wait.service
L+ /etc/systemd/system/poweroff.target.wants/plymouth-poweroff.service - - - - /usr/lib/systemd/system/plymouth-poweroff.service
L+ /etc/systemd/system/reboot.target.wants/plymouth-reboot.service - - - - /usr/lib/systemd/system/plymouth-reboot.service
