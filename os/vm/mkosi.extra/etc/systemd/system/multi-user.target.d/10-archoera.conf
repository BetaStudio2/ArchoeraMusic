# ArchoeraOS：把关键单元拉进 multi-user.target。
#
# 为什么用普通文件 drop-in 而不是 `.wants` 符号链接：mkosi 拷入 `mkosi.extra` 时会丢掉
# 符号链接（实测镜像里 `.wants/NetworkManager.service` 等并不存在），而 drop-in 里的
# `Wants=` 同样能把单元拉进事务，且是普通文件（稳定落盘）。
#
# ⚠ 必须写成一**行**：systemd 对同一个 unit 文件里的列表型设置是「后者覆盖前者」
# （不是累加！），拆成多行 `Wants=` 只有最后一行生效 —— 实测拆行时只有
# plymouth-quit-wait 被拉起，NetworkManager/bluetooth/polkit/resolved 全都没起来。
[Unit]
Wants=NetworkManager.service bluetooth.service polkit.service systemd-resolved.service plymouth-quit.service plymouth-quit-wait.service
