# ArchoeraOS 最小 VM（用于裸机 / DRM-KMS 后端验证）
# 用法：mkosi -C os/vm build   /   mkosi -C os/vm vm
# 标准内核（linux 包）；无桌面环境：仅 systemd + 图形/输入运行时。

[Distribution]
Distribution=arch
Release=rolling
# 国内加速源（清华 TUNA）；默认是 fastly.mirror.pkgbuild.com
Mirror=https://mirrors.tuna.tsinghua.edu.cn/archlinux

[Output]
Format=disk
OutputDirectory=mkosi.output
ImageId=archoera-kiosk

[Content]
Bootable=yes
# 系统 locale（mkosi 写入 /etc/locale.conf；locale 由 locale.gen 触发生成）。
Locale=en_US.UTF-8
# 开机画面（Plymouth：主镜像内启动，见 mkosi.extra 的 plymouth 主题与单元 enablement）。
# 注：我们以 console=hvc0 收日志，plymouth 见到串口会强制文本 details 主题；
# plymouth.ignore-serial-consoles 让它忽略串口、照常使用图形主题。
KernelCommandLine=splash plymouth.ignore-serial-consoles
Bootloader=systemd-boot
# 自动登录不用 mkosi 的 Autologin=（它只支持 root）：见
#   mkosi.extra/etc/systemd/system/getty@tty1.service.d/autologin.conf（archoera 用户）
#   mkosi.extra/etc/systemd/system/serial-getty@hvc0.service.d/autologin.conf（root 调试口）
# 官方 SSH（VSock）：配合 `mkosi genkey` 后可用 `mkosi ssh` 进客户机排查。
Ssh=yes
Packages=
    systemd
    linux
    mkinitcpio
    mesa
    libdrm
    libinput
    libxkbcommon
    xkeyboard-config
    seatd
    dbus
    openssh
    bash
    util-linux
    kmod
    e2fsprogs
    shadow
    procps-ng
    # ── ArchoeraMusic 运行时（对齐 packaging/linux/PKGBUILD 的 depends）──
    gtk3
    libayatana-appindicator
    libdbusmenu-glib
    libepoxy
    fontconfig
    fribidi
    libx11
    libxi
    at-spi2-atk
    libcloudproviders
    taglib
    curl
    openssl
    sqlite
    xz
    zlib
    ttf-dejavu
    # bundle 内嵌 FFmpeg 动态依赖系统编解码库；glycin 供封面图像解码。
    ffmpeg
    glycin
    icu
    # 凭据保险库（libsecret）与光标主题。
    libsecret
    adwaita-icon-theme
    # GTK 的 cursor-theme/font 名称来自 gsettings；缺失会让 GTK 报
    # "Unable to load  from the cursor theme" 并退回空光标。
    gsettings-desktop-schemas
    # 输入法：fcitx5 的 Wayland 前端以 zwp_input_method_v2 接入合成器。
    fcitx5
    fcitx5-chinese-addons
    # 开机/关机画面（Plymouth；主题见 mkosi.extra/usr/share/plymouth/themes/archoera）。
    plymouth
    # 电源动作授权：logind 的 power-off/reboot/suspend/hibernate 由 polkit 判定
    # （默认策略 allow_active=yes：活动会话免鉴权，与普通桌面一致）。
    polkit
    # 蓝牙状态（BlueZ 守护进程；VM 无适配器时 UI 也应显示「无蓝牙适配器」）。
    bluez
    bluez-utils
    # 字体：播放器 9 种语言含中日韩，缺字体会让「语言」列表显示豆腐块。
    noto-fonts
    noto-fonts-cjk
    noto-fonts-emoji

[Build]
CacheDirectory=mkosi.cache

[Runtime]
# 无头运行：控制台只读转发（后台可捕获日志，不等待终端输入）。
Console=read-only
