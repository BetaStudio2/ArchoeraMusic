# 追加进 mkosi-initrd 镜像的配置（mkosi 会自动合并配置目录下的本文件）。
# 目的：让 Plymouth 从 **initrd 阶段** 就开始显示开机画面（而不是等主镜像阶段）。
[Content]
Packages=
    plymouth
# 早期启动**需要**的固件必须打进 initrd：USB 蓝牙（intel/ibt-*、rtl_bt/*）、
# 无线（iwlwifi/mediatek/qca）、有线网卡（rtl_nic/*）。此前用 FirmwareExclude=.* 全部排除，
# 结果真机上蓝牙适配器直接不可用（`btusb` 在 initrd 阶段就 probe，取不到固件就废），
# 有线网卡也可能因此拿不到链路 —— 这正是「无蓝牙适配器 / 上不了网」的根因之一。
# 注：mkosi 的 FirmwareInclude 是 **glob 白名单**（设置后即替代「按 initrd 内模块全带」的
# 默认行为）；FirmwareExclude 是 regex 黑名单且会把白名单一并滤掉，故这里不再设 Exclude。
# 体积约 +75MB：rtl_nic 184K、rtl_bt 984K、intel BT ~2M、iwlwifi ~50M、mediatek ~20M。
FirmwareInclude=
    rtl_nic/*
    rtl_bt/*
    intel/ibt-*
    intel/iwlwifi-*
    mediatek/*
    qca/*
# 关键：mkosi-initrd 默认的模块表没有 virtio_gpu，initrd 里就没有 DRM 设备，
# Plymouth 无从显示（会退回文本）。这里补上，QEMU/真机 KMS 都能尽早出画面。
KernelModules=
    virtio_gpu
    # 真机存储/总线：U 盘（xhci/usb-storage）、SATA/NVMe、SD 卡。
    xhci_pci
    xhci_hcd
    usb_storage
    uas
    sdhci
    sdhci_pci
    mmc_core
    mmc_block
    # 注意：**不要**把 i915/amdgpu/nouveau/radeon 放进 initrd —— 装了 linux-firmware 后
    # mkosi-initrd 会把这些模块的固件一并打包，initrd 会暴涨（ESP 固定 512M，会写不下）。
    # GPU 驱动留在主镜像即可：Plymouth 从主镜像阶段启动，此时模块/固件已可用，照样出画面。
    # 输入：USB HID 与 I2C HID（触摸板/触摸屏）。
    usbhid
    hid_generic
    i2c_hid
    i2c_hid_acpi
    # QEMU 里的虚拟输入（VM 验证用）。
    virtio_input
ExtraTrees=
    mkosi.initrd.extra
