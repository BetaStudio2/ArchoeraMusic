# ArchoeraOS fcitx5 classicui 主题（候选窗 / 菜单）。
# 与应用 AppPalette.dark 对齐：近黑底、克制圆角、细描边、柔和投影。
# 素材由 ../fcitx5-theme/gen_theme.py 生成；9 宫格 Margin = 投影 8 + 圆角 10 = 18。
[Metadata]
Name=Archoera
Name[zh_CN]=Archoera
Version=1
Author=Archoera && BetaStudio2
Description=ArchoeraOS 深色候选窗（与应用近黑风格一致）
ScaleWithDPI=True

[InputPanel]
NormalColor=#ececec
HighlightColor=#ffffff
HighlightBackgroundColor=#2a2a2a
HighlightCandidateColor=#ffffff
CandidateLabelColor=#9e9e9e
HighlightCandidateLabelColor=#d0d3da
CandidateCommentColor=#9e9e9e
