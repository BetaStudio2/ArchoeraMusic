# 追加进 mkosi-initrd 镜像的配置（mkosi 会自动合并配置目录下的本文件）。
# 目的：让 Plymouth 从 **initrd 阶段** 就开始显示开机画面（而不是等主镜像阶段）。
[Content]
Packages=
    plymouth
# 关键：mkosi-initrd 默认的模块表没有 virtio_gpu，initrd 里就没有 DRM 设备，
# Plymouth 无从显示（会退回文本）。这里补上，QEMU/真机 KMS 都能尽早出画面。
KernelModules=
    virtio_gpu
    # 真机存储/总线：U 盘（xhci/usb-storage）、SATA/NVMe、SD 卡。
    xhci_pci
    xhci_hcd
    usb_storage
    uas
    sdhci
    sdhci_pci
    mmc_core
    mmc_block
    # 真机显示：Intel / AMD / NVIDIA(nouveau) / 老 Radeon —— Plymouth 早期就要出画面。
    i915
    amdgpu
    nouveau
    radeon
    # 输入：USB HID 与 I2C HID（触摸板/触摸屏）。
    usbhid
    hid_generic
    i2c_hid
    i2c_hid_acpi
    # QEMU 里的虚拟输入（VM 验证用）。
    virtio_input
ExtraTrees=
    mkosi.initrd.extra
