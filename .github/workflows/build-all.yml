# =====================================================================
#  按发行版/平台分开构建 + tag(v*) Release。
#
#  Linux 为何不共用一份产物：引擎链接 FFmpeg、scraper 链接 TagLib，二者
#  soname 跨发行版会 bump（libavformat.so.60→.63、libtag.so.1→.2）。在单一
#  发行版（Ubuntu）上构建再重打包，会在别的发行版上因 soname 不匹配而无法
#  加载（实测 Arch 上引擎与 scraper 均加载失败）。故每个发行版在自己的容器
#  内从源码构建，链接并使用该发行版自身的 FFmpeg/TagLib。
#
#  ┌─ linux-deb    (ubuntu-24.04 runner) : ubuntu24.04.deb + linux tar.gz + AppImage
#  │                                      + flatpak + NixOS
#  ├─ linux-deepin (ubuntu:20.04 容器)    : deepin.deb（老 glibc 基线；失败即放弃）
#  ├─ linux-rpm    (fedora 容器)          : fedora.rpm
#  ├─ linux-arch   (archlinux 容器)       : arch.pkg.tar.zst
#  ├─ build        (matrix macos/windows) : .app / NSIS+portable zip
#  └─ release      (needs 全部；tag v* 触发)
#
#  产物文件名带发行版标识（如 ArchoeraMusic-v<ver>-ubuntu24.04-x86_64.deb、
#  -fedora-x86_64.rpm、-arch-x86_64.pkg.tar.zst），且包内 BUILD-INFO.txt 写明
#  构建目标 / 基线 / 最低 glibc / 提交，用户无需靠后缀猜适用性。
#
#  三个 Linux job 共用 .github/actions/build-linux（复合 action）：工具链
#  (rust/go/dotnet/flutter) → Zig 0.16 → build-linux.sh → zig build test →
#  pub get/analyze/test → vault 端到端 → flutter build linux。发行版专属的
#  系统依赖安装与打包由各 job 负责。
#
#  Zig 0.16 安装沿用已修复逻辑（f99266b / 7116dfc）：归档名按 0.15.1+ 新规则
#  zig-<arch>-<os>；GITHUB_PATH 对当前步骤不生效，同步骤内用绝对路径验证。
#
#  ┌─ release job ─────────────────────────────────────────────────────
#  │  needs: [build, linux-deb, linux-rpm, linux-arch]；仅 push tag v* 触发；
#  │  下载全部 artifact 后聚合为 GitHub Release。release 需要 contents: write，
#  │  故在 job 级覆盖顶层 permissions。tag 名即版本（沿用仓库现有 v* 标签）。
#  └──────────────────────────────────────────────────────────────────
name: Build all platforms & release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
            zig_archive: aarch64-macos
          - os: windows
            runner: windows-latest
            zig_archive: x86_64-windows
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      # ───────────────────────── macOS（Homebrew 依赖）────────────────
      - name: Install Homebrew deps
        if: matrix.os == 'macos'
        # macos-15（Xcode 16）:macOS 14 runner 为 Xcode 15.4，其 /usr/lib/swift
        # 缺少 libswift_Builtin_float 等 stub，NativeAOT Swift autolink 报 8 个
        # __swift_FORCE_LOAD_$_swift_* 未定义（dotnet/runtime#125858 官方答复
        # 要求 Xcode 16+，googleads-ios-unity#3760）。Xcode 16 SDK 含完整 stubs。
        # 不装 brew 的 ffmpeg：它默认 --enable-gpl（GPL-3.0），破坏本项目
        # THIRD-PARTY-LICENSES 的「GPL 防火墙」；改用自建纯 LGPL 最小 FFmpeg
        # （见 build-ffmpeg-minimal.sh）。dylibbundler 用于把 FFmpeg/TagLib
        # dylib 收进 .app 并改写 install_name（自包含）。
        run: |
          brew install taglib curl openssl sqlite nlohmann-json pkg-config dylibbundler

      # ───────────────────────── Windows（mingw / vcpkg）───────────────
      - name: Install mingw (cgo C 编译器，go -buildmode=c-shared 需要)
        if: matrix.os == 'windows'
        shell: bash
        # pkgconfiglite 已移除：Windows 原生模块不依赖 pkg-config
        # （audio-engine 由 build_windows.bat 的 cl.exe 直编、scraper 走
        #   vcpkg toolchain、subsonic 的 sqlite 为 pure-Go modernc 实现）
        run: choco install mingw -y --no-progress

      - name: Cache vcpkg installed (恢复；ffmpeg/taglib 等预编译跨 run 秒级恢复)
        if: matrix.os == 'windows'
        id: vcpkg-cache
        uses: actions/cache@v5
        with:
          # 同时缓存 vcpkg 二进制缓存（archives）：只缓存 vcpkg_installed 时
          # vcpkg install 仍会因 ABI/完整性校验重编 ffmpeg（~13 分钟）；缓存
          # archives 后可直接命中预编译包。
          path: |
            app/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-installed-${{ hashFiles('app/vcpkg.json') }}

      - name: Install vcpkg deps (manifest 模式，依赖清单见 app/vcpkg.json)
        if: matrix.os == 'windows'
        shell: bash
        working-directory: app
        # x64-windows-release：只编译/安装 Release 库，跳过 debug 变体
        # （ffmpeg 等包 debug+release 双编译耗时可省一半，且无 debug 库可被误链）
        # 注意：manifest 模式安装根固定为 ./vcpkg_installed，不受 VCPKG_INSTALLED_DIR
        # 环境变量影响，不要手动覆盖以免与 CMake toolchain 的定位不一致。
        # 此处显式 install 仅为 vcpkg_installed 缓存加速；build_windows.bat 内含
        # headers 缺失时自动 install 的幂等兜底，本地开发无需手动预装。
        # 输出重定向到文件、只回显尾部：vcpkg 编译 ffmpeg 会打印海量 `\r` 进度行，
        # 直接进 Actions 日志会让网页日志查看器卡死（表现为「步骤点不开」）。
        run: |
          vcpkg install --triplet x64-windows-release > vcpkg-install.log 2>&1 || {
            echo "::error::vcpkg install 失败，尾部日志："; tail -200 vcpkg-install.log; exit 1;
          }
          echo "vcpkg install 完成"; tail -20 vcpkg-install.log
        env:
          VCPKG_ROOT: C:\vcpkg

      # 可选：C++/WinRT 投影头（原生 Toast 用）。失败不致命——build_windows.bat
      # 仅在头存在时才启用 win_toast.cpp；否则 Zig 弱符号兜底走 PowerShell 调 WinRT。
      # classic 模式（从 runner.temp 运行，避免 manifest 模式拒绝单包参数）。
      - name: Install C++/WinRT headers (Windows, 可选：原生 Toast)
        if: matrix.os == 'windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        continue-on-error: true
        run: vcpkg install cppwinrt --triplet x64-windows-release
        env:
          VCPKG_ROOT: C:\vcpkg

      # save-always 已弃用（job 失败时不生效），改为显式 save：
      # vcpkg install 成功后立即落缓存，此后任意步骤失败均不影响复用
      - name: Cache vcpkg installed (保存，供下次 run 秒级恢复)
        if: matrix.os == 'windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            app/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-installed-${{ hashFiles('app/vcpkg.json') }}

      # ──────────────────────── 工具链（三端共用）─────────────────────
      # CMake 用 runner 自带版本（ubuntu-24.04 = 3.28.3，满足 FindSQLite3 3.14+）；
      # 不引入 actions-setup-cmake：其版本解析走 GitHub releases 分页，
      # 旧版本号（如 v3.28.7）超出分页范围会报 Unable to find version
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: app/core/subsonic/go.sum
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ──────────────────── Zig 0.16（EraAudio kernel）────────────────
      - name: Install Zig 0.16 (EraAudio kernel)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          VER=0.16.0
          ZA="${{ matrix.zig_archive }}"
          ZD="$HOME/.local/zig-$VER"
          if [ ! -x "$ZD/zig" ]; then
            mkdir -p "$HOME/.local"
            curl -fsSL "https://ziglang.org/download/$VER/zig-$ZA-$VER.tar.xz" -o /tmp/zig.tar.xz
            tar -C "$HOME/.local" -xf /tmp/zig.tar.xz
            mv "$HOME/.local/zig-$ZA-$VER" "$ZD"
          fi
          echo "$ZD" >> "$GITHUB_PATH"
          # GITHUB_PATH 对当前步骤不生效：同步骤用绝对路径验证
          "$ZD/zig" version

      - name: Install Zig 0.16 (EraAudio kernel, windows-msvc)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '0.16.0'
          $zd = Join-Path $env:LOCALAPPDATA "zig-$ver"
          if (!(Test-Path (Join-Path $zd 'zig.exe'))) {
            $zip = Join-Path $env:TEMP "zig.zip"
            Invoke-WebRequest -Uri "https://ziglang.org/download/$ver/zig-x86_64-windows-$ver.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $env:LOCALAPPDATA -Force
            Move-Item (Join-Path $env:LOCALAPPDATA "zig-x86_64-windows-$ver") $zd -Force
          }
          Add-Content $env:GITHUB_PATH $zd
          & (Join-Path $zd 'zig.exe') version

      # ─────────── macOS：自建纯 LGPL 最小 FFmpeg（自包含 + 许可证）───────────
      # 不用 brew 的 ffmpeg（GPL），改为自建；见 build-ffmpeg-minimal.sh。
      - name: Cache minimal FFmpeg (macOS)
        if: matrix.os == 'macos'
        id: ffmpeg-cache-macos
        uses: actions/cache@v5
        with:
          path: ~/.local/ffmpeg-minimal
          key: ffmpeg-minimal-7.1.1-${{ runner.os }}-${{ runner.arch }}

      - name: Build minimal FFmpeg (macOS, LGPL)
        if: matrix.os == 'macos' && steps.ffmpeg-cache-macos.outputs.cache-hit != 'true'
        run: bash app/core/build-ffmpeg-minimal.sh

      - name: Point build at minimal FFmpeg (macOS)
        if: matrix.os == 'macos'
        run: |
          PREFIX="$HOME/.local/ffmpeg-minimal"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"

      # ──────────────────── 原生模块编译（各自一站式入口）──────────────
      - name: Build native modules (macOS 一站式脚本)
        if: matrix.os == 'macos'
        # 统一入口 app/core/build-macos.sh，收敛 audio-engine / scraper /
        # scanner / vault / downloader / subsonic 全部原生模块编译：
        # 本地开发与 CI 共用同一入口，逻辑改动只落一处（对齐 build_windows.bat）。
        # 依赖由上方步骤提前安装，脚本只做编译引导。
        run: bash app/core/build-macos.sh osx-arm64

      - name: Build native modules (Windows bat 一站式引导)
        if: matrix.os == 'windows'
        shell: cmd
        # 统一入口 app/core/build_windows.bat，在单个 cmd 会话内完成全部模块：
        #   vswhere→vcvars64（MSVC 环境）→ audio-engine（cargo tempo + cl 直编
        #   fft.dll/archoera_mediaengine.dll）→ scraper（CMake+vcpkg toolchain）
        #   → scanner（dotnet publish）→ downloader（cargo）→ subsonic（go+rust）
        #   → vault（dotnet publish）。
        # 依赖由上方步骤提前安装（vcpkg headers 缺失时 bat 内自动 install 兜底），
        # 脚本只做编译引导。与 build-linux.sh / build-macos.sh 同构，本地开发
        # 与 CI 共用同一入口，逻辑改动只落一处。
        env:
          VCPKG_TARGET_TRIPLET: x64-windows-release
          # 可选原生 Toast：build_windows.bat 检测该目录含 winrt 头时才启用
          CPPWINRT_INCLUDE: C:\vcpkg\installed\x64-windows-release\include
        working-directory: app/core
        # 输出重定向到文件、只回显尾部（同 vcpkg：避免海量 `\r` 进度行卡死网页
        # 日志查看器）；完整日志经下方 artifact 上传，失败时 tail 可见。
        run: |
          call build_windows.bat > build_windows.log 2>&1
          set RC=%ERRORLEVEL%
          echo "==== build_windows.log (tail 150) ===="
          powershell -NoProfile -Command "Get-Content -Tail 150 build_windows.log"
          if not "%RC%"=="0" (echo "::error::build_windows.bat 失败 rc=%RC%" & exit /b %RC%)

      - name: Upload Windows build logs (排查用)
        if: matrix.os == 'windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            app/vcpkg-install.log
            app/core/build_windows.log
          if-no-files-found: ignore

      # ───────────── Flutter pub get / analyze / test（统一在 app/）─────
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: dart analyze lib

      - name: Test (unit smoke)
        working-directory: app
        run: flutter test test/widget_test.dart

      # ──────────────────────── Flutter 端构建（分平台）─────────────────
      - name: Build Flutter macOS
        if: matrix.os == 'macos'
        working-directory: app
        # 工程 Release 配置已用 ad-hoc 签名（CODE_SIGN_IDENTITY = "-"），CI 无需证书；
        # 现行 Flutter 的 build macos 不再支持 --no-codesign，去掉即可。
        run: flutter build macos --release

      - name: Build Flutter Windows
        if: matrix.os == 'windows'
        working-directory: app
        # platform bridge（MSVC C++）经 CMake 内嵌构建，WinRT(SMTC/Toast) 需
        # cppwinrt 头；缺头时 backend_windows.cpp 自动降级（SMTC 禁用）。
        env:
          CPPWINRT_INCLUDE: C:\vcpkg\installed\x64-windows-release\include
        run: flutter build windows --release

      # ─────────────── Windows：NSIS 安装器 + 便携 zip ──────────────
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package Windows (NSIS installer + portable zip)
        if: matrix.os == 'windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ver = (Select-String -Path "app/pubspec.yaml" -Pattern '^version:').Line.Split(' ')[1].Trim()
          $rel = "app\build\windows\x64\runner\Release"
          $out = "build\windows-extra"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # 防伪公钥随包分发（供用户离线验签；私钥绝不入库/入包）
          Copy-Item "app\tool\watermark_pub.pem" "$rel\ARCHOERA_PUBKEY.pem" -Force

          # 便携 zip：Release 目录整体（含 native/、data/、插件 dll）
          Compress-Archive -Path "$rel\*" -DestinationPath "$out\ArchoeraMusic-$ver-windows-x64-portable.zip" -Force

          # NSIS 安装器（优先 PATH 内 makensis，其次 choco 默认安装目录）
          $mk = Get-Command makensis -ErrorAction SilentlyContinue
          if ($null -eq $mk) { $mk = "C:\Program Files (x86)\NSIS\makensis.exe" }
          else { $mk = $mk.Source }
          & $mk `
            /DVERSION="$ver" `
            /DAPP_DIR="$PWD\$rel" `
            /DOUT_FILE="$PWD\$out\ArchoeraMusic-$ver-windows-x64-setup.exe" `
            packaging\windows\archoera_music.nsi
          Get-ChildItem "$out"

      - name: Verify EraSync kernel bundled (Windows)
        if: matrix.os == 'windows'
        # 硬校验：EraSync 内核 DLL 必须在 Release 目录（否则运行期加载 mediaengine 失败/闪退）
        shell: pwsh
        run: |
          $p = "app\build\windows\x64\runner\Release\archoera_kernel.dll"
          if (!(Test-Path $p)) { throw "archoera_kernel.dll 未打入 Windows 包（EraSync 内核缺失）" }
          Write-Host "OK: $p"

      # ─────────────── macOS：把原生库拷入 .app（native/ 平铺）──────────
      - name: Bundle native libs into .app (native/ 平铺)
        if: matrix.os == 'macos'
        # macOS 无 CMake install 层（Flutter macOS 走 Xcode），FFI 库须在此显式拷入
        # .app/Contents/native/（NativeLibPaths 祖先链从 exe 向上第 2 级 Contents 命中）。
        # 与 linux/windows 的 bundle/native/ 平铺布局对齐（ffi-libs-layout 计划）。
        run: |
          set -euo pipefail
          APP="app/build/macos/Build/Products/Release/archoera_music.app"
          NATIVE="$APP/Contents/native"
          mkdir -p "$NATIVE"
          cp app/core/audio-engine/build/archoera-audio-engine "$NATIVE/" || true
          cp app/core/audio-engine/build/*.dylib "$NATIVE/"
          cp app/core/scanner/build/*.dylib "$NATIVE/"
          cp app/core/scraper/build/*.dylib "$NATIVE/"
          cp app/core/subsonic/build/*.dylib "$NATIVE/"
          cp app/core/downloader/target/release/libarchoera_downloader.dylib "$NATIVE/"
          cp app/core/vault/build/archoera-vault "$NATIVE/"

          # 自包含运行库：把引擎(FFmpeg)/scraper(TagLib) 的 dylib 依赖收进 native/
          # 并把 install_name 改写为 @loader_path，运行期不再依赖构建机 brew 路径
          # （否则用户机无 brew 时加载失败）。
          for lib in libarchoera_mediaengine.dylib libarchoera_scraper.dylib; do
            [[ -f "$NATIVE/$lib" ]] || continue
            dylibbundler -of -b -x "$NATIVE/$lib" -d "$NATIVE" -p @loader_path
          done

          # LGPL 合规：随包附 FFmpeg / TagLib 许可文本 + 聚合声明
          bash app/core/bundle-licenses.sh "$APP/Contents"

          # 防伪公钥随包分发（供用户离线验签；私钥绝不入库/入包）
          mkdir -p "$APP/Contents/Resources"
          cp app/tool/watermark_pub.pem "$APP/Contents/Resources/ARCHOERA_PUBKEY.pem"

          # 新增/改写 dylib 会使原 ad-hoc 签名失效（Apple Silicon 拒载未签名 dylib）→ 重签整包
          codesign --force --deep --sign - "$APP"

          echo "native/ 内容:"
          ls -la "$NATIVE"

      - name: Upload artifact (macOS .app)
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-macos-arm64
          path: app/build/macos/Build/Products/Release/archoera_music.app
          if-no-files-found: error

      - name: Upload artifact (Windows runner Release)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-windows-x64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error

      - name: Upload artifact (Windows NSIS + portable)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-windows-extra
          path: build/windows-extra/*
          if-no-files-found: error

  # =====================================================================
  #  Linux 按发行版分开构建：每个发行版在自己的容器内从源码编译，链接并使用
  #  该发行版自身的 FFmpeg / TagLib。原因：二者 soname 跨发行版会 bump
  #  （libavformat.so.60→.63、libtag.so.1→.2），在 Ubuntu 上构建再重打包到
  #  Arch 会因 soname 不匹配而加载失败（引擎与 scraper 均实测失败）。
  #  公共构建逻辑收敛在 .github/actions/build-linux（复合 action）。
  # =====================================================================

  # ── Debian/Ubuntu：.deb + tar.gz + AppImage + flatpak + NixOS ─────────
  linux-deb:
    name: Linux deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # 不装系统 FFmpeg 开发包：引擎改用自建最小 FFmpeg（见 build-linux action）
          sudo apt-get install -y \
            build-essential ninja-build pkg-config clang \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev libtag1-dev \
            nlohmann-json3-dev libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libdbus-1-dev libayatana-appindicator3-dev \
            patchelf nasm
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-linux
        with:
          cache_key_suffix: ubuntu2404
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Install packaging tools
        run: |
          sudo apt-get update
          # rpm 在 fedora job 构建，此处只需 flatpak（AppImage 工具另行下载）
          sudo apt-get install -y flatpak
          # appimagetool（CI 无 FUSE，运行时用 --appimage-extract-and-run）
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          sudo mv /tmp/appimagetool.AppImage /usr/local/bin/appimagetool
          # type2 runtime 预下载（appimagetool 打包时不再联网下载，规避网络抖动）
          wget -q https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -O /tmp/type2-runtime
          # linuxdeploy：AppImage 装配时收拢 GTK/FFmpeg/TagLib 等动态依赖
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
      - name: Package tar.gz (纯二进制)
        run: bash packaging/linux/package.sh tar app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: linux
      - name: Package .deb (Ubuntu 24.04)
        run: bash packaging/linux/package.sh deb app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: ubuntu24.04
      - name: Package AppImage (通用)
        run: bash packaging/linux/package.sh appimage app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: linux
          APPIMAGE_RUNTIME_FILE: /tmp/type2-runtime
          LINUXDEPLOY: /tmp/linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Package Flatpak (通用)
        run: bash packaging/linux/package-flatpak.sh app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: flatpak
      - name: Package NixOS flake (nixos/nix container, autoPatchelf)
        # bundle 为 Release 预 strip 产物，autoPatchelfHook 在容器内补
        # interpreter（NixOS 无 /lib64/ld-linux-x86-64.so.2）并追加 buildInputs
        # store 路径 RUNPATH（NixOS 无 /usr/lib）。产物仅供 CI 验证构建链路 +
        # 交付 portable 源包；用户机器上正规安装方式是跑 package.sh nix 后
        # 在本机 nix build（store 路径与 nixpkgs 版本强绑定）。
        run: |
          bash packaging/linux/package.sh nix app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
          docker run --rm -v "$PWD":/workspace \
            -e PKG_VER="${{ steps.version.outputs.version }}" \
            -e GH_TOKEN="${{ github.token }}" \
            nixos/nix:latest bash -c '
              # /workspace 是 git 仓库且归宿主 runner 所有；nix 对 git 仓库
              # 输入走 libgit2 且拒绝"非当前用户所有"（容器 root vs 宿主 1001）。
              # 复制到容器内非 git 目录按 plain path（path:）输入构建，绕开
              # libgit2 所有权检查（nix 仍把目录复制进 store 保证可复现）。
              mkdir -p /tmp/nixbuild
              cp -a /workspace/packaging/linux/work/nix/. /tmp/nixbuild/
              cd /tmp/nixbuild
              # 传 token：nixos-unstable 未锁，每次解析会打 GitHub API；无认证
              # 会被限流（HTTP 403）导致打包失败。access-tokens 带认证后正常。
              nix --extra-experimental-features "nix-command flakes" \
                --option access-tokens "github.com=${GH_TOKEN}" \
                build .#default --no-sandbox || exit 1
              # result 指向容器 /nix/store，readlink 后打包完整 store 产物
              tar -C "$(readlink -f result)" -czf \
                "/workspace/dist/linux/ArchoeraMusic-v${PKG_VER}-nixos-x86_64.tar.gz" .
            '
          ls -la dist/linux/ArchoeraMusic-v${{ steps.version.outputs.version }}-nixos-x86_64.tar.gz
      - name: Upload bundle artifact (原始 bundle)
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-linux-x64
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error
      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-linux-deb
          path: dist/linux/*
          if-no-files-found: error

  # ── Deepin：单独开包（老基线 glibc）────────────────────────────────────
  # Deepin 基于 Debian，系统库较旧：Ubuntu 24.04 产物（glibc 2.39）在 Deepin 上
  # 起不来。此 job 在**最老的可行基线**（Ubuntu 20.04 / glibc 2.31，即 Flutter
  # 要求的地板）上从源码构建，产出单独的 .deb（DISTRO_TAG=deepin）。若仍无法在
  # Deepin 运行且不可解决，则放弃该 job 与 Deepin 支持。
  linux-deepin:
    name: Linux deb (Deepin 23)
    runs-on: ubuntu-24.04
    # 在真·Deepin 23 容器内构建（官方 linuxdeepin/beige，Debian bookworm 系，
    # glibc 2.35）：产物覆盖 Deepin 23/25。不用 Ubuntu 24.04 包硬塞——其
    # GLIBC_2.36 需求超过 Deepin 23 的 2.35，会加载失败。
    container: linuxdeepin/beige
    env:
      BUILD_BASE: deepin-23
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates build-essential cmake ninja-build pkg-config clang sudo \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev libtag1-dev \
            nlohmann-json3-dev libgtk-3-dev liblzma-dev \
            libdbus-1-dev libayatana-appindicator3-dev \
            patchelf nasm git curl wget xz-utils unzip zip jq file
      - uses: actions/checkout@v5
      - name: Git safe directory (容器属主)
        run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/build-linux
        with:
          cache_key_suffix: deepin23
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Package .deb (Deepin)
        run: bash packaging/linux/package.sh deb app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: deepin
      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-linux-deepin
          path: dist/linux/*
          if-no-files-found: error

  # ── Fedora/RHEL：.rpm（fedora 容器内从源码构建）───────────────────────
  linux-rpm:
    name: Linux rpm (Fedora)
    runs-on: ubuntu-24.04
    container: fedora:latest
    env:
      BUILD_BASE: fedora
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git curl wget tar xz which findutils gzip unzip zip jq file \
            gcc gcc-c++ clang cmake ninja-build pkgconf-pkg-config make \
            patchelf nasm \
            taglib-devel libcurl-devel openssl-devel sqlite-devel \
            json-devel gtk3-devel dbus-devel libstdc++-devel libicu \
            rpm-build zstd libarchive \
            libayatana-appindicator-gtk3-devel
          # 不装系统 FFmpeg 开发包：引擎改用自建最小 FFmpeg（见 build-linux action）
      - uses: actions/checkout@v5
      - name: Git safe directory (容器属主)
        run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/build-linux
        with:
          cache_key_suffix: fedora
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Package .rpm (Fedora/RHEL/openSUSE)
        run: bash packaging/linux/package.sh rpm app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: fedora
      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-linux-rpm
          path: dist/linux/*
          if-no-files-found: error

  # ── Arch Linux：.pkg.tar.zst（archlinux 容器内从源码构建）─────────────
  linux-arch:
    name: Linux pkg.tar.zst (Arch)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      BUILD_BASE: archlinux
    steps:
      - name: Install system dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel git curl wget tar xz which findutils unzip zip jq file zstd libarchive \
            cmake ninja clang pkgconf patchelf nasm \
            taglib curl openssl sqlite nlohmann-json \
            gtk3 dbus libayatana-appindicator
          # 不装系统 ffmpeg：引擎改用自建最小 FFmpeg（见 build-linux action）
      - uses: actions/checkout@v5
      - name: Git safe directory (容器属主)
        run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/build-linux
        with:
          cache_key_suffix: arch
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Package Arch pkg.tar.zst (makepkg as nobody)
        env:
          DISTRO_TAG: arch
        run: |
          bash packaging/linux/package.sh arch app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
          # makepkg 拒绝 root 运行；nobody 需先解除镜像预设的账户过期
          chown -R nobody:nobody packaging/linux/work/arch
          chage -E -1 nobody
          su nobody -s /bin/bash -c \
            'cd packaging/linux/work/arch && HOME=/tmp makepkg -f --skipinteg --nocheck --nodeps'
          # 统一命名为显著标识发行版的文件名（pkg 内部元数据不变）
          cp packaging/linux/work/arch/*.pkg.tar.zst \
            "dist/linux/ArchoeraMusic-v${{ steps.version.outputs.version }}-arch-x86_64.pkg.tar.zst"
          echo "→ dist/linux/$(ls dist/linux/ | grep '\.pkg\.tar\.zst$')"
      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-linux-arch
          path: dist/linux/*
          if-no-files-found: error

  # =====================================================================
  #  release：仅 push tag v* 触发，汇总全部平台 artifact 发布 GitHub Release。
  #  needs 保证所有平台全部构建成功才发版（任一端失败 → 不发版）。
  #  方案选 gh CLI（ubuntu runner 预装，免引第三方 action，且可按 assets/*
  #  精确控制多文件上传；软props/action-gh-release@v2 对目录型产物
  #  （macOS .app / Windows Release 目录）需要逐个 glob，不便聚合成单 asset）。
  #  tag 名即版本（仓库现有 v* 标签原样使用）；同名 release 已存在时
  #  （如手动重跑同一 tag）退化为补传/覆盖资产，幂等。
  # =====================================================================
  release:
    name: Release ${{ github.ref_name }}
    needs: [build, linux-deb, linux-rpm, linux-arch, linux-deepin]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 受保护 Environment：需 Required reviewers 手动批准后才运行；
    # 两把签名私钥作为 Environment secret 存放（仅本作业可见，非仓库级缓存）。
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout (签名工具 + 公钥)
        uses: actions/checkout@v4

      - name: Download all platform build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          test -d artifacts/ArchoeraMusic-linux-x64       # Linux 原始 bundle (Ubuntu)
          test -d artifacts/ArchoeraMusic-linux-deb       # Linux deb 包集 (Ubuntu)
          test -d artifacts/ArchoeraMusic-linux-deepin    # Linux deb 包集 (Deepin)
          test -d artifacts/ArchoeraMusic-linux-rpm       # Linux rpm 包集
          test -d artifacts/ArchoeraMusic-linux-arch      # Linux pkg.tar.zst
          test -d artifacts/ArchoeraMusic-macos-arm64     # macOS .app
          test -d artifacts/ArchoeraMusic-windows-x64     # Windows runner Release
          test -d artifacts/ArchoeraMusic-windows-extra   # Windows NSIS + portable
          mkdir -p assets
          # Linux：各发行版安装包直接作为独立 asset（tar.gz/deb/AppImage/flatpak/
          # nixos/rpm/pkg.tar.zst 均已带版本号，名称不冲突）
          cp artifacts/ArchoeraMusic-linux-deb/* assets/
          cp artifacts/ArchoeraMusic-linux-deepin/* assets/
          cp artifacts/ArchoeraMusic-linux-rpm/* assets/
          cp artifacts/ArchoeraMusic-linux-arch/* assets/
          # Windows：NSIS 安装器与便携 zip 直接作为独立 asset
          cp artifacts/ArchoeraMusic-windows-extra/* assets/
          # upload-artifact@v4 打包会丢失可执行位：下载后按 Mach-O/ELF magic
          # 恢复 +x（否则 .app/Contents/MacOS 主二进制与 native/ 子进程解包后无法运行）
          while IFS=: read -r fp _; do
            chmod +x "$fp"
          done < <(find artifacts -type f -exec file {} + | grep -i 'ELF\|Mach-O')
          # macOS / Windows 目录型产物压成单文件归档（tar 三端可解）
          tar -czf "assets/ArchoeraMusic-${VER}-macos-arm64.tar.gz" \
            -C artifacts/ArchoeraMusic-macos-arm64 .
          tar -czf "assets/ArchoeraMusic-${VER}-windows-x64.tar.gz" \
            -C artifacts/ArchoeraMusic-windows-x64 .
          # Linux 原始 bundle 与 package.sh tar 纯二进制内容一致，不再重复出包
          echo "── release assets ──"
          ls -la assets

      # 发布签名 —— CI 用 key1 签 `.sig1`：私钥来自受保护 `release` Environment
      # （需人工批准），Windows runner 不参与。公钥随发布分发。未配置则不签、不阻断。
      - name: 签名发布资产（key1 → .sig1）
        shell: bash
        env:
          ARCHOERA_WM_KEY1_PEM: ${{ secrets.ARCHOERA_WM_KEY1_PEM }}
        run: |
          set -euo pipefail
          cp app/tool/watermark_pub.pem assets/ARCHOERA_PUBKEY.pem
          if [ -n "${ARCHOERA_WM_KEY1_PEM:-}" ]; then
            bash app/tool/sign_release.sh assets
          else
            echo "未配置 ARCHOERA_WM_KEY1_PEM，跳过签名（不影响出包）"
          fi
          echo "── final assets ──"
          ls -la assets

      - name: Create GitHub Release (tag v*)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"

          # 从 CHANGELOG.md 抽取本 tag 对应段落作为 Release 正文
          # （标题形如 `## [0.9.15+8] - 2026-09-12`）。用 index() 字面匹配，
          # 避免版本号里的 `+` 被当正则量词；抽到下一个 `## [` 为止。
          NOTES=release_notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              /^## \[/ { if (in_sec) exit; if (index($0, "[" ver "]") > 0) { in_sec=1; next } }
              in_sec { print }
            ' CHANGELOG.md > "$NOTES"
          fi

          if [ -s "$NOTES" ]; then
            echo "── Release 正文（来自 CHANGELOG.md，$VER）──"
            cat "$NOTES"
          else
            echo "CHANGELOG.md 未找到 $VER 段落，回退通用文案"
            printf '三端 matrix 构建产物：Linux 多发行版安装包 / macOS arm64 / Windows x64。\n' > "$NOTES"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明 + 补传/覆盖资产（幂等重跑）"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "ArchoeraMusic ${VER}" \
              --notes-file "$NOTES"
          fi
