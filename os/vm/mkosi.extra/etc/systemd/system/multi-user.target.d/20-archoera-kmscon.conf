# ArchoeraOS：在 tty3 拉起 kmscon（可显示中文的控制台）。
#
# 为什么要它：内核自带 console 的字形上限放不下 CJK，装中文字体也没用；kmscon 走
# DRM/KMS + Pango/fontconfig 渲染，配合镜像里已有的 noto-fonts-cjk 就能正常显示中文。
# 位置选 tty3：tty1 是 kiosk、tty2 是安装器的 root 自动登录，避免互相抢占。
#
# 注意：kmscon 需要 DRM 主控；它只在 tty3 处于前台时占用显示，切回 tty1 会把主控交还
# 给 kiosk。若真机上发现它与 kiosk 抢显示，删掉本文件即可关闭（改为纯英文 tty2 排查）。
[Unit]
Wants=kmsconvt@tty3.service
