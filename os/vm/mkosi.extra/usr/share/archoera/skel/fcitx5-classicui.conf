# ArchoeraOS 默认 fcitx5 classicui 观感：使用自带的 archoera 深色主题（与应用一致）。
# 主题素材见 /usr/share/fcitx5/themes/archoera（由 os/vm/fcitx5-theme/gen_theme.py 生成）。
Theme=archoera
DarkTheme=archoera
UseDarkTheme=False
UseAccentColor=False

# 候选列表：横向（与桌面习惯一致）；支持滚轮翻页。
Vertical Candidate List=False
WheelForPaging=True

# 字体：Sans 经 fontconfig 回退到 Noto Sans CJK，覆盖中日韩。
Font="Sans 11"
MenuFont="Sans 11"
TrayFont="Sans Bold 10"

# 图标：优先命名图标，并在图标上显示布局名（触摸 / 小屏更易辨认）。
PreferTextIcon=False
ShowLayoutNameInIcon=True
UseInputMethodLanguageToDisplayText=True

# Wayland / 缩放：跟随合成器的分数缩放，避免候选窗模糊。
PerScreenDPI=True
ForceWaylandDPI=0
EnableFractionalScale=True
