# ArchoeraOS 最小 VM（用于裸机 / DRM-KMS 后端验证）
# 用法：mkosi -C os/vm build   /   mkosi -C os/vm vm
# 标准内核（linux 包）；无桌面环境：仅 systemd + 图形/输入运行时。

[Distribution]
Distribution=arch
Release=rolling
# 国内加速源（清华 TUNA）；默认是 fastly.mirror.pkgbuild.com
Mirror=https://mirrors.tuna.tsinghua.edu.cn/archlinux

[Output]
Format=disk
# 用自定义分区定义（见 mkosi.repart/）：ESP 固定 1G（默认 512M 装不下一整套 initrd/微码）。
RepartDirectories=mkosi.repart
OutputDirectory=mkosi.output
ImageId=archoera-kiosk

[Content]
Bootable=yes
# 系统 locale（mkosi 写入 /etc/locale.conf；locale 由 locale.gen 触发生成）。
Locale=en_US.UTF-8
# 开机画面（Plymouth：主镜像内启动，见 mkosi.extra 的 plymouth 主题与单元 enablement）。
# 注：我们以 console=hvc0 收日志，plymouth 见到串口会强制文本 details 主题；
# plymouth.ignore-serial-consoles 让它忽略串口、照常使用图形主题。
KernelCommandLine=splash plymouth.ignore-serial-consoles
Bootloader=systemd-boot
# 自动登录不用 mkosi 的 Autologin=（它只支持 root）：见
#   mkosi.extra/etc/systemd/system/getty@tty1.service.d/autologin.conf（archoera 用户）
#   mkosi.extra/etc/systemd/system/serial-getty@hvc0.service.d/autologin.conf（root 调试口）
# 官方 SSH（VSock）：配合 `mkosi genkey` 后可用 `mkosi ssh` 进客户机排查。
Ssh=yes
Packages=    systemd
    # poweroff/reboot/halt/shutdown 与 /sbin/init 兼容软链在这个包里（systemd 本体
    # 不含）。缺了它们：dracut 在 chroot 里 install 'poweroff/reboot/halt' 直接失败
    # → initrd 生不出来（而安装器当时还会报成功）；装好的系统也少了这几个命令。
    systemd-sysvcompat
    linux
    # initrd 生成器：安装后的系统用 dracut（见 /etc/kernel/install.conf 与
    # /etc/dracut.conf.d/archoera.conf）。Live 镜像自身的 initrd 由 mkosi-initrd
    # 在构建期生成，与此无关。dracut 提供 initramfs 虚拟包，满足 linux 的依赖。
    dracut
    mesa
    libdrm
    libinput
    libxkbcommon
    xkeyboard-config
    seatd
    dbus
    openssh
    bash
    util-linux
    kmod
    e2fsprogs
    # 安装向导可选的根文件系统工具（xfs/f2fs）；exfatprogs 供 U 盘/Ventoy 读写。
    xfsprogs
    f2fs-tools
    exfatprogs
    shadow
    procps-ng
    # ── ArchoeraMusic 运行时（对齐 packaging/linux/PKGBUILD 的 depends）──
    gtk3
    libayatana-appindicator
    libdbusmenu-glib
    libepoxy
    fontconfig
    fribidi
    libx11
    libxi
    at-spi2-atk
    libcloudproviders
    taglib
    curl
    openssl
    sqlite
    xz
    zlib
    ttf-dejavu
    # bundle 内嵌 FFmpeg 动态依赖系统编解码库；glycin 供封面图像解码。
    ffmpeg
    glycin
    icu
    # 凭据保险库（libsecret）与光标主题。
    libsecret
    adwaita-icon-theme
    # GTK 的 cursor-theme/font 名称来自 gsettings；缺失会让 GTK 报
    # "Unable to load  from the cursor theme" 并退回空光标。
    gsettings-desktop-schemas
    # 输入法：fcitx5 的 Wayland 前端以 zwp_input_method_v2 接入合成器。
    fcitx5
    fcitx5-chinese-addons
    # ── 真机基础依赖 ──
    # 固件（元包）：Intel/AMD/NVIDIA 显示、Realtek/Atheros/MediaTek/Intel 无线、蓝牙等。
    linux-firmware
    # CPU 微码（镜像内会由 mkinitcpio/systemd-boot 自动带上）。
    amd-ucode
    intel-ucode
    # 音频：现代 Intel 笔记本 DSP 固件 + ALSA UCM 路由配置。
    sof-firmware
    alsa-ucm-conf
    # 音频服务端：播放引擎（miniaudio）走 **PulseAudio** 后端，镜像里必须有服务端，
    # 否则真机「系统」里完全没声音（此前只有 libpulse，连不上任何服务端）。
    # PipeWire + WirePlumber 是 Arch 现行默认栈；pipewire-pulse 提供 PA 兼容接口，
    # pipewire-alsa 让纯 ALSA 客户端也能出声，alsa-utils 提供 alsactl 初始混音器状态。
    pipewire
    pipewire-pulse
    pipewire-alsa
    wireplumber
    alsa-utils
    # 网络：NetworkManager（D-Bus 激活 + 开机启用，WiFi/有线）、wpa_supplicant。
    networkmanager
    wpa_supplicant
    # 现场排查常用小工具。
    less
    tar
    # 开机/关机画面（Plymouth；主题见 mkosi.extra/usr/share/plymouth/themes/archoera）。
    plymouth
    # 电源动作授权：logind 的 power-off/reboot/suspend/hibernate 由 polkit 判定
    # （默认策略 allow_active=yes：活动会话免鉴权，与普通桌面一致）。
    polkit
    # 蓝牙状态（BlueZ 守护进程；VM 无适配器时 UI 也应显示「无蓝牙适配器」）。
    bluez
    bluez-utils
    # 字体：播放器 9 种语言含中日韩，缺字体会让「语言」列表显示豆腐块。
    noto-fonts
    noto-fonts-cjk
    noto-fonts-emoji

[Build]
CacheDirectory=mkosi.cache

[Runtime]
# 无头运行：控制台只读转发（后台可捕获日志，不等待终端输入）。
Console=read-only
