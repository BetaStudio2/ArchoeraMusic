# ArchoeraOS：kernel-install 的标准 systemd-boot 布局。
#
# layout=bls              → 内核/initrd 放 $ESP/<machine-id>/<kver>/，条目写
#                           loader/entries/<machine-id>-<kver>.conf（条目里的
#                           options 取自 /etc/kernel/cmdline，由安装器按
#                           root=PARTUUID / rd.luks.name / rootflags=subvol=@ 写入）。
# initrd_generator=dracut → 由 dracut 的 50-dracut.install 生成 initrd；
#                           mkinitcpio 的 50-mkinitcpio.install 见到该值会自行退出（不再重复生成）。
#
# 效果：安装完成后，`pacman -Syu` 升级内核会经 systemd 的 hook 自动跑 kernel-install，
# ESP 里的内核/initrd 与新条目一起更新，不再需要手工拷贝。
layout=bls
initrd_generator=dracut
