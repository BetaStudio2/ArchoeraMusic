# =====================================================================
#  ArchoeraOS（os/）Rust workspace 的质量门禁。
#
#  与 build-all.yml 分工：后者只在 tag(v*) 上产出各平台发行包；本工作流面向
#  开发迭代，在改动 os/** 的 push / PR 上跑 fmt / clippy / test，并额外做
#  udev 裸机后端（DRM/KMS + libinput + libseat）的**特性编译检查**。
#
#  说明：
#  - udev 只编译、不运行：CI runner 没有 /dev/dri 与 /dev/input，真实上机
#    验证仍需维护者硬件（见 docs/archoera-os.md §13）。
#  - 默认（winit）后端动态链接仅有 libxkbcommon；EGL/GLES 由渲染层运行时
#    dlopen，故构建期只需 libxkbcommon-dev。
#  - udev 特性经 libseat-sys / libdrm / gbm / libinput / libudev 的
#    pkg-config 探测，对应 libseat-dev / libdrm-dev / libgbm-dev /
#    libinput-dev / libudev-dev。
# =====================================================================
name: ArchoeraOS (os/) CI

on:
  push:
    paths:
      - 'os/**'
      - '.github/workflows/os-ci.yml'
  pull_request:
    paths:
      - 'os/**'
      - '.github/workflows/os-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / clippy / test（含 udev 编译检查）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: os

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo registry 与 target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            os/target
          key: ${{ runner.os }}-os-cargo-${{ hashFiles('os/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-os-cargo-

      - name: 安装系统依赖（xkbcommon + udev 后端的 DRM/GBM/input/seat/udev）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libseat-dev libdrm-dev libgbm-dev libinput-dev libudev-dev

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告即失败）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --workspace

      - name: udev 后端编译检查（clippy，特征开启）
        run: cargo clippy -p archoera-shell --features udev --all-targets -- -D warnings
