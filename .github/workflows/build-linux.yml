name: Build Linux

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config clang \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev libtag1-dev \
            nlohmann-json3-dev libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev

      # 固定 CMake 版本：FindSQLite3 自 3.14 才定义 SQLite3::SQLite3 IMPORTED target，
      # 不同 runner 镜像 / 发行版自带版本不一，统一固定避免依赖探测行为漂移
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          version: 'v3.28.7'
          use-cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: app/core/subsonic/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build native modules (Linux 一站式脚本)
        # 统一入口 app/core/build-linux.sh，收敛 audio-engine / scraper /
        # scanner / vault / downloader / subsonic 全部原生模块编译：
        # 本地开发与 CI 共用同一入口，逻辑改动只落一处（对齐 build_windows.bat）。
        # 依赖由上方步骤提前安装，脚本只做编译引导。
        run: bash app/core/build-linux.sh

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: dart analyze lib

      - name: Test (unit smoke)
        working-directory: app
        run: flutter test test/widget_test.dart

      - name: Test vault 会话存储（凭据保险库端到端）
        working-directory: app
        run: |
          # headless runner 无 D-Bus Secret Service：构建测试二进制（VAULT_TESTING
          # 条件编译，含测试明文存储；生产 build.sh 产物不含该逻辑，绝不用于测试）
          bash core/vault/build-test.sh linux-x64
          # 测试二进制需同时设置明文存储 env（显式 opt-in；生产二进制无此分支，
          # 且 VaultProcess 默认路径校验 PROD 标记拒绝测试二进制，仅显式
          # ARCHOERA_VAULT_BIN + 本 env 组合仅供测试）
          ARCHOERA_VAULT_BIN=$PWD/core/vault/build/archoera-vault-test \
          ARCHOERA_VAULT_INSECURE_FILE_STORE=1 \
            flutter test test/vault_session_store_test.dart

      - name: Build Flutter Linux
        working-directory: app
        run: flutter build linux --release

      - name: Resolve version
        id: version
        run: |
          # 标签推送（v*）→ 去掉 v；手动触发 → 回退 pubspec 版本
          VER="${GITHUB_REF_NAME#v}"
          if [[ -z "$VER" || "$VER" == "$GITHUB_REF_NAME" ]]; then
            VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak
          # appimagetool（CI 无 FUSE，运行时用 --appimage-extract-and-run）
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          sudo mv /tmp/appimagetool.AppImage /usr/local/bin/appimagetool
          # type2 runtime 预下载（appimagetool 打包时不再联网下载，规避网络抖动）
          wget -q https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -O /tmp/type2-runtime

      - name: Package tar.gz (纯二进制)
        run: bash packaging/linux/package.sh tar app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"

      - name: Package .deb (Debian/Ubuntu)
        run: bash packaging/linux/package.sh deb app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"

      - name: Package .rpm (Fedora/RHEL/openSUSE)
        run: bash packaging/linux/package.sh rpm app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"

      - name: Package AppImage (通用)
        run: bash packaging/linux/package.sh appimage app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          APPIMAGE_RUNTIME_FILE: /tmp/type2-runtime

      - name: Package Arch pkg.tar.zst (makepkg in archlinux container)
        run: |
          bash packaging/linux/package.sh arch app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
          docker run --rm -v "$PWD":/workspace -w /workspace/packaging/linux/work/arch \
            archlinux:latest bash -c '
              pacman -Sy --noconfirm --needed base-devel >/dev/null 2>&1 || exit 1
              chown -R nobody:nobody .
              # 新版 archlinux 镜像给 nobody 设了账户过期，su 会报 "account has expired"，先清除
              chage -E -1 nobody
              # 预构建产物打包：--nodeps 跳过运行时依赖检查（depends 仍写入
              # .PKGINFO 供安装端使用），避免容器内安装整套依赖拖慢 CI
              su nobody -s /bin/bash -c "HOME=/tmp makepkg -f --skipinteg --nocheck --nodeps" || exit 1
            '
          cp packaging/linux/work/arch/*.pkg.tar.zst dist/linux/
          echo "→ dist/linux/$(ls dist/linux/ | grep '\.pkg\.tar\.zst$')"

      - name: Package Flatpak (通用)
        run: bash packaging/linux/package-flatpak.sh app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"

      - name: Upload bundle artifact (原始 bundle)
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-linux-x64
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchoeraMusic-linux-packages
          path: dist/linux/*
          if-no-files-found: error
