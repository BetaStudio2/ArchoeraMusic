# ArchoeraOS Live 介质（用于制作 U 盘 / 安装到内部磁盘）
#
# 与常规镜像的差异：
#   - 只读 root + tmpfs overlay（systemd.volatile=overlay）：U 盘/SD 卡上以最小写入运行；
#   - 内核参数 archoera.live=1：会话与应用据此进入「安装模式」（显示安装向导入口）；
#   - 安装器后端（脚本 + root 单元 + polkit 规则）只在 Live 里存在，装好后不带入目标系统。
#
# 构建：os/vm/build.sh build --profile live
# 产物：mkosi.output/archoera-live.raw（dd 到 U 盘即可启动）

[Output]
ImageId=archoera-live
# 混合 ISO：ISO9660 + El Torito（EFI 引导目录）+ GPT（ESP + root）。
# 同一份产物既可 dd 到 U 盘，也可作为 ISO 光盘镜像；mkosi 交给 systemd-repart
# 的 `--el-torito`（systemd >= 261）生成。initrd 侧用 loop 设备重读 GPT
# （mkosi-initrd 的模块表已含 loop），故 ISO 引导时也能找到 root 分区。
ElTorito=yes
ElToritoVolume=ARCHOERA_LIVE
ElToritoSystem=ARCHOERA_OS
ElToritoPublisher=ArchoeraOS

[Content]
KernelCommandLine=systemd.volatile=overlay archoera.live=1
# 安装器需要的工具：rsync 复制 root；dosfstools 制作 ESP（vfat）。
Packages=
    rsync
    dosfstools
ExtraTrees=
    live-extra
