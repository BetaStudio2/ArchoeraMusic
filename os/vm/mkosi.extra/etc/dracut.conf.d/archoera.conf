# ArchoeraOS：安装后系统的 initrd 生成策略（dracut）。
#
# 为什么是 dracut：安装后的 root 可能是 ext4/btrfs(子卷)/xfs/f2fs，且可选 LUKS2；
# 这些在 initrd 阶段都要「看得出、解得开」。dracut 的 systemd + crypt 模块直接
# 支持 crypttab 与 rd.luks.name，hostonly=no 保证换硬件/换盘口（含 USB）也能起。
#
# 生成时机：内核升级由 systemd 的 pacman hook 调 `kernel-install`，
# 插件链里的 50-dracut.install 负责造 initrd、90-loaderentry.install 负责
# 按 BLS 布局写 /boot/<machine-id>/<kver>/ 与 loader/entries/*.conf
# （见 /etc/kernel/install.conf 的 initrd_generator=dracut）。

# systemd 提供 sd-encrypt/rd.luks.* 与 crypttab 处理；crypt 兜底传统路径。
add_dracutmodules+=" systemd crypt "

# ⚠ USB 必须全代际强制带上：只带 xhci 时，USB2 口/旧控制器上的键盘与 U 盘
# 在 initrd 阶段不枚举 —— 表现是 LUKS 口令打不进去、U 盘装好的系统起不来。
force_drivers+=" xhci_pci xhci_hcd ehci_pci ehci_hcd ohci_hcd uhci_hcd usb_storage uas "
# 根文件系统与 U 盘常见的文件系统（vfat/exfat + 代码页）。
force_drivers+=" vfat exfat nls_cp437 nls_iso8859-1 nls_utf8 "
# btrfs 子卷 / xfs / f2fs 的 fsck 与挂载工具。
force_drivers+=" btrfs xfs f2fs "

# 不按本机裁剪：允许把系统装到 U 盘、换机启动。
hostonly="no"
# 从目标系统的 /etc/fstab 读取根与交换（含 btrfs 子卷的 subvol= 选项）。
use_fstab="yes"
compress="zstd"
