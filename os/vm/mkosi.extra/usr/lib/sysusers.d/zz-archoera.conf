# ArchoeraOS 默认用户：Archoera
# uid/gid 固定为 1000（kiosk 会话的宿主用户；数据落在 /home/archoera）。
# 组成员资格：
#   seat            —— seatd/libseat 后端所需的会话组
#   tty             —— 会话脚本把日志写入串口 /dev/hvc0
#   video/render    —— DRM/KMS 设备（libseat 之外直接访问 render 节点）
#   input           —— libinput 读取输入设备
#   audio           —— 直接访问音频设备（PipeWire/ALSA 兜底）
# 文件名以 zz- 开头：确保在 seatd.conf 定义 seat 组之后再处理“m”条目
u archoera 1000 "Archoera" /home/archoera /bin/bash
m archoera seat
m archoera tty
m archoera video
m archoera render
m archoera input
m archoera audio
